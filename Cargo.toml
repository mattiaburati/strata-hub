[package]
name = "strata-dashboard"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper",
    "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_System_Time", "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
